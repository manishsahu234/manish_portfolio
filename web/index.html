
<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="Manish Sahu - Flutter Developer Portfolio">

  <title>Manish Sahu | Flutter Developer</title>

  <link rel="manifest" href="manifest.json">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #050505;
    }

    body {
      overflow: hidden;
    }

    #app-loader {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050505;
      opacity: 1;
      visibility: visible;
      transition: opacity 450ms ease, visibility 450ms ease;
    }

    #app-loader.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
    }

    .animation-stage {
      position: relative;
      width: 190px;
      height: 190px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .orbit {
      position: absolute;
      width: 180px;
      height: 180px;
      border: 1px solid rgba(198, 169, 107, 0.25);
      border-radius: 50%;
      animation: rotate 5s linear infinite;
    }

    .orbit::before {
      content: "";
      position: absolute;
      top: 18px;
      left: 18px;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #C6A96B;
      box-shadow: 0 0 15px #C6A96B;
    }

    .orbit-inner {
      position: absolute;
      width: 145px;
      height: 145px;
      border: 1px dashed rgba(198, 169, 107, 0.35);
      border-radius: 50%;
      animation: rotate 9s linear infinite reverse;
    }

    @keyframes rotate {
      to {
        transform: rotate(360deg);
      }
    }

    .loader-logo {
      position: relative;
      z-index: 2;
      width: 68px;
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #C6A96B;
      border-radius: 19px;
      background: #090909;
      color: #C6A96B;
      font-family: Arial, sans-serif;
      font-size: 25px;
      font-weight: 800;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      50% {
        transform: scale(1.08);
        box-shadow: 0 0 35px rgba(198, 169, 107, 0.25);
      }
    }

    .loader-name {
      color: #F5F5F5;
      font-family: Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 6px;
    }

    .loader-caption {
      color: #929292;
      font-family: Arial, sans-serif;
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .loader-progress {
      width: 145px;
      height: 2px;
      overflow: hidden;
      background: #262626;
    }

    .loader-progress span {
      display: block;
      width: 35%;
      height: 100%;
      background: #C6A96B;
      animation: progress 1.1s ease-in-out infinite;
    }

    @keyframes progress {
      from { transform: translateX(-110%); }
      to { transform: translateX(420%); }
    }
  </style>
</head>

<body>

  <div id="app-loader">
    <div class="loader-content">

      <div class="animation-stage">
        <div class="orbit"></div>
        <div class="orbit-inner"></div>
        <div class="loader-logo">MS</div>
      </div>

      <div class="loader-name">MANISH SAHU</div>
      <div class="loader-caption">Flutter Developer</div>

      <div class="loader-progress">
        <span></span>
      </div>

    </div>
  </div>

  <script>
    // Hide only after Flutter actually renders.
let flutterRendered = false;

window.addEventListener('flutter-first-frame', function () {
  flutterRendered = true;

  const loader = document.getElementById('app-loader');

  if (!loader) return;

  loader.classList.add('hide');

  setTimeout(function () {
    loader.remove();
    document.body.style.overflow = 'auto';
  }, 450);
});
  </script>

  <script src="flutter_bootstrap.js" async></script>

</body>
</html>
